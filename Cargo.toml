[package]
name = "migrate"
version = "0.1.6"
authors = ["Deisss <deisss@free.fr>"]
edition = "2018"
license = "MIT"
keywords = ["database", "migration", "migrate", "mysql", "postgres", "postgresql", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
config = "0.15"
clap = "4.5"
glob = "0.3"
regex = "1"
native-tls = "0.2.14"
postgres-native-tls = "0.5.2"
postgres = "0.19.12"
rusqlite = { version = "0.38", features = ["bundled"] }
mysql = "27"
slog = "2.8"
slog-async = "2.8"
slog-term = "2.9.2"
chrono = "0.4"
md5 = "0.8"
console = "0.16"

[profile.release]
opt-level = 'z'
lto = true
# codegen-units = 1

[[bin]]
name = "migrate"
